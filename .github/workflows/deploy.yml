name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Project Pages are served from /<repo>/, not /. This tells
          # Vite to prefix built asset URLs accordingly — see vite.config.ts.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Set under Settings → Secrets and variables → Actions →
          # Variables once the Worker is deployed — see docs/telegram-setup.md.
          VITE_SUBMISSION_ENDPOINT: ${{ vars.VITE_SUBMISSION_ENDPOINT }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
